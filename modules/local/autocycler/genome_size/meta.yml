---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "autocycler_genome_size"
description: Estimate the genome size from long reads with a quick Raven assembly
keywords:
  - autocycler
  - assembly
  - long reads
  - consensus
  - genome size
tools:
  - "autocycler":
      description: Consensus long-read assembly of bacterial genomes
      homepage: https://github.com/rrwick/Autocycler
      documentation: https://github.com/rrwick/Autocycler/wiki
      licence: ["GPL-3.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
    - reads:
        type: file
        description: Long reads in FastQ format
output:
  size:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - GENOME_SIZE:
          type: string
          description: Estimated genome size in bases
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
