---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "autocycler_combine"
description: Combine the resolved clusters into the final consensus assembly
keywords:
  - autocycler
  - assembly
  - long reads
  - consensus
tools:
  - "autocycler":
      description: Consensus long-read assembly of bacterial genomes
      homepage: https://github.com/rrwick/Autocycler
      documentation: https://github.com/rrwick/Autocycler/wiki
      licence: ["GPL-3.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
    - resolved_clusters:
        type: directory
        description: Resolved cluster directories from `autocycler trim` and `autocycler resolve`
    - autocycler_out:
        type: directory
        description: Autocycler directory after clustering
    - subsample_yaml:
        type: file
        description: Read metrics from `autocycler subsample`
        pattern: "subsample.yaml"
output:
  fasta:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "consensus_assembly.fasta":
          type: file
          description: Consensus assembly
          pattern: "consensus_assembly.fasta"
  gfa:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "consensus_assembly.gfa":
          type: file
          description: Consensus assembly graph
          pattern: "consensus_assembly.gfa"
  metrics:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "*_autocycler_metrics.tsv":
          type: file
          description: Header and one line of Autocycler metrics, from `autocycler table`
          pattern: "*_autocycler_metrics.tsv"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
