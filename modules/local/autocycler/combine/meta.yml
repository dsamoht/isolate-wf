---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "autocycler_combine"
description: Combine the resolved clusters into the final consensus assembly
keywords:
  - autocycler
  - assembly
  - long reads
  - consensus
tools:
  - "autocycler":
      description: Consensus long-read assembly of bacterial genomes
      homepage: https://github.com/rrwick/Autocycler
      documentation: https://github.com/rrwick/Autocycler/wiki
      licence: ["GPL-3.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
    - resolved_gfas:
        type: file
        description: Resolved cluster graphs
    - autocycler_out:
        type: directory
        description: Autocycler directory after clustering
output:
  fasta:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "autocycler_out_final/consensus_assembly.fasta":
          type: file
          description: Consensus assembly
          pattern: "autocycler_out_final/consensus_assembly.fasta"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
