---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "autocycler_assemble"
description: Assemble one read subset with one assembler through `autocycler helper`
keywords:
  - autocycler
  - assembly
  - long reads
  - consensus
tools:
  - "autocycler":
      description: Consensus long-read assembly of bacterial genomes
      homepage: https://github.com/rrwick/Autocycler
      documentation: https://github.com/rrwick/Autocycler/wiki
      licence: ["GPL-3.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
    - reads:
        type: file
        description: Read subset in FastQ format
    - genome_size:
        type: string
        description: Estimated genome size in bases
    - read_type:
        type: string
        description: "Read type: ont_r9, ont_r10, pacbio_clr or pacbio_hifi"
output:
  fasta:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "${meta.assembler}_*.fasta":
          type: file
          description: Assembly, absent when the assembler failed
          pattern: "${meta.assembler}_*.fasta"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
