---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "autocycler_cluster"
description: Cluster the input contigs into putative replicons
keywords:
  - autocycler
  - assembly
  - long reads
  - consensus
  - clustering
tools:
  - "autocycler":
      description: Consensus long-read assembly of bacterial genomes
      homepage: https://github.com/rrwick/Autocycler
      documentation: https://github.com/rrwick/Autocycler/wiki
      licence: ["GPL-3.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
    - autocycler_out:
        type: directory
        description: Autocycler directory from `autocycler compress`
output:
  qc_clusters:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "autocycler_out_work/clustering/qc_pass/cluster_*":
          type: directory
          description: Clusters that passed QC
          pattern: "autocycler_out_work/clustering/qc_pass/cluster_*"
  autocycler_out:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "autocycler_out_work":
          type: directory
          description: Autocycler directory after clustering
          pattern: "autocycler_out_work"
  clustering:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "autocycler_out_work/clustering":
          type: directory
          description: Clustering results (clustering.tsv, clustering.newick, clustering.yaml) and the qc_pass and qc_fail cluster directories
          pattern: "autocycler_out_work/clustering"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
