---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "checkm2"
description: Estimate completeness and contamination of an assembly with CheckM2
keywords:
  - checkm2
  - completeness
  - contamination
  - qc
tools:
  - "checkm2":
      description: Rapid assessment of genome bin quality using machine learning
      homepage: https://github.com/chklovski/CheckM2
      documentation: https://github.com/chklovski/CheckM2#usage
      licence: ["GPL-3.0"]
      identifier: biotools:checkm2
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
    - assembly:
        type: file
        description: Assembly in FASTA format
output:
  report:
    - - meta:
          type: map
          description: Groovy Map containing sample information, e.g. `[ id:'sample1' ]`
      - "checkm2_out/quality_report.tsv":
          type: file
          description: CheckM2 quality report
          pattern: "checkm2_out/quality_report.tsv"
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
authors:
  - "@dsamoht"
maintainers:
  - "@dsamoht"
